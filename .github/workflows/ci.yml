name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --release

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  static-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build -p lumic-cli --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: lumic-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/lumic

  install-images:
    needs: static-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - debian:13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lumic-x86_64-unknown-linux-musl
          path: dist
      - run: chmod +x dist/lumic tests/install-smoke.sh install.sh
      - name: Install and smoke test on ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD/dist/lumic:/opt/lumic:ro" \
            -v "$PWD/install.sh:/install.sh:ro" \
            -v "$PWD/tests/install-smoke.sh:/test.sh:ro" \
            -e LUMIC_TEST_BINARY=/opt/lumic \
            "${{ matrix.image }}" /test.sh
