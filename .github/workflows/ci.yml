name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo build --locked --workspace --release
      - run: tests/epic-a-smoke.sh
        env:
          LUMIC_TEST_BINARY: target/release/lumic
      - run: tests/epic-b-smoke.sh
        env:
          LUMIC_TEST_BINARY: target/release/lumic
      - run: tests/epic-c-smoke.sh
        env:
          LUMIC_TEST_BINARY: target/release/lumic
      - run: tests/epic-d-smoke.sh
        env:
          LUMIC_TEST_BINARY: target/release/lumic

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --deny warnings

  static-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked -p lumic-cli -p lumic-daemon --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: lumic-x86_64-unknown-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/lumic
            target/x86_64-unknown-linux-musl/release/lumicd

  install-images:
    needs: static-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - debian:13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lumic-x86_64-unknown-linux-musl
          path: dist
      - run: chmod +x dist/lumic dist/lumicd tests/install-smoke.sh tests/epic-b-smoke.sh tests/epic-d-smoke.sh install.sh
      - name: Install and smoke test on ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD/dist/lumic:/opt/lumic:ro" \
            -v "$PWD/dist/lumicd:/opt/lumicd:ro" \
            -v "$PWD/install.sh:/install.sh:ro" \
            -v "$PWD/tests/install-smoke.sh:/test.sh:ro" \
            -v "$PWD/tests/epic-d-smoke.sh:/epic-d-test.sh:ro" \
            -e LUMIC_TEST_BINARY=/opt/lumic \
            -e LUMIC_TEST_DAEMON_BINARY=/opt/lumicd \
            "${{ matrix.image }}" sh -c '/test.sh && apt-get update && apt-get install -y git && /epic-d-test.sh'

  managed-services:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p lumic-cli --release
      - run: sudo apt-get update
      - name: PostgreSQL and Redis live lifecycle smoke test
        run: sudo -E env LUMIC_TEST_BINARY="$PWD/target/release/lumic" LUMIC_MANAGED_SERVICE_LIVE=1 "$PWD/tests/epic-b-smoke.sh"

  recipes-host-operator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p lumic-cli --release
      - run: sudo apt-get update
      - name: Recipe lifecycle and host-operator smoke test
        run: sudo -E env LUMIC_TEST_BINARY="$PWD/target/release/lumic" LUMIC_EPIC_C_LIVE=1 "$PWD/tests/epic-c-smoke.sh"
