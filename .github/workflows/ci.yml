name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo build --locked --workspace --release
      - run: tests/epic-a-smoke.sh
        env:
          LUMIC_TEST_BINARY: target/release/lumic
      - run: tests/epic-b-smoke.sh
        env:
          LUMIC_TEST_BINARY: target/release/lumic
      - run: tests/epic-c-smoke.sh
        env:
          LUMIC_TEST_BINARY: target/release/lumic
      - run: tests/epic-d-smoke.sh
        env:
          LUMIC_TEST_BINARY: target/release/lumic
      - run: tests/epic-e-smoke.sh
        env:
          LUMIC_TEST_BINARY: target/release/lumic
      - run: tests/epic-f-smoke.sh
        env:
          LUMIC_TEST_BINARY: target/release/lumic
      - run: tests/epic-g-smoke.sh
        env:
          LUMIC_TEST_BINARY: target/release/lumic

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # main
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  static-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked -p lumic-cli -p lumic-daemon --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lumic-x86_64-unknown-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/lumic
            target/x86_64-unknown-linux-musl/release/lumicd

  install-images:
    needs: static-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - debian:13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lumic-x86_64-unknown-linux-musl
          path: dist
      - run: chmod +x dist/lumic dist/lumicd tests/install-smoke.sh tests/epic-b-smoke.sh tests/epic-d-smoke.sh tests/epic-g-smoke.sh install.sh
      - name: Install and smoke test on ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD/dist/lumic:/opt/lumic:ro" \
            -v "$PWD/dist/lumicd:/opt/lumicd:ro" \
            -v "$PWD/install.sh:/install.sh:ro" \
            -v "$PWD/tests/install-smoke.sh:/test.sh:ro" \
            -v "$PWD/tests/epic-d-smoke.sh:/epic-d-test.sh:ro" \
            -v "$PWD/tests/epic-g-smoke.sh:/epic-g-test.sh:ro" \
            -e LUMIC_TEST_BINARY=/opt/lumic \
            -e LUMIC_TEST_DAEMON_BINARY=/opt/lumicd \
            "${{ matrix.image }}" sh -c '/test.sh && apt-get update && apt-get install -y git && /epic-d-test.sh && /epic-g-test.sh'

  managed-services:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - run: cargo build --locked -p lumic-cli --release
      - run: sudo apt-get update
      - name: Reset runner MySQL for fresh-host coverage
        run: tests/reset-github-runner-mysql.sh
      - name: MySQL, PostgreSQL and Redis live lifecycle smoke test
        run: sudo -E env LUMIC_TEST_BINARY="$PWD/target/release/lumic" LUMIC_MANAGED_SERVICE_LIVE=1 "$PWD/tests/epic-b-smoke.sh"
      - name: Laravel and Redis intelligence apply and rollback smoke test
        run: sudo -E env LUMIC_TEST_BINARY="$PWD/target/release/lumic" LUMIC_EPIC_F_LIVE=1 "$PWD/tests/epic-f-smoke.sh"

  recipes-host-operator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - run: cargo build --locked -p lumic-cli --release
      - run: sudo apt-get update
      - name: Recipe lifecycle and host-operator smoke test
        run: sudo -E env LUMIC_TEST_BINARY="$PWD/target/release/lumic" LUMIC_EPIC_C_LIVE=1 "$PWD/tests/epic-c-smoke.sh"
