name: Nightly build

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo build --locked -p lumic-cli -p lumic-daemon --release --target x86_64-unknown-linux-musl
      - run: tests/epic-a-smoke.sh
        env:
          LUMIC_TEST_BINARY: target/x86_64-unknown-linux-musl/release/lumic
      - run: tests/epic-b-smoke.sh
        env:
          LUMIC_TEST_BINARY: target/x86_64-unknown-linux-musl/release/lumic
      - run: tests/epic-d-smoke.sh
        env:
          LUMIC_TEST_BINARY: target/x86_64-unknown-linux-musl/release/lumic
      - run: tests/epic-g-smoke.sh
        env:
          LUMIC_TEST_BINARY: target/x86_64-unknown-linux-musl/release/lumic
      - run: |
          cp target/x86_64-unknown-linux-musl/release/lumic lumic-x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/lumicd lumicd-x86_64-unknown-linux-musl
          sha256sum lumic-x86_64-unknown-linux-musl > lumic-x86_64-unknown-linux-musl.sha256
          sha256sum lumicd-x86_64-unknown-linux-musl > lumicd-x86_64-unknown-linux-musl.sha256
      - name: Smoke installer images
        run: |
          chmod +x lumic-x86_64-unknown-linux-musl lumicd-x86_64-unknown-linux-musl tests/install-smoke.sh tests/epic-d-smoke.sh tests/epic-g-smoke.sh install.sh
          for image in ubuntu:22.04 ubuntu:24.04 debian:12 debian:13; do
            docker run --rm \
              -v "$PWD/lumic-x86_64-unknown-linux-musl:/opt/lumic:ro" \
              -v "$PWD/lumicd-x86_64-unknown-linux-musl:/opt/lumicd:ro" \
              -v "$PWD/install.sh:/install.sh:ro" \
              -v "$PWD/tests/install-smoke.sh:/test.sh:ro" \
              -v "$PWD/tests/epic-d-smoke.sh:/epic-d-test.sh:ro" \
              -v "$PWD/tests/epic-g-smoke.sh:/epic-g-test.sh:ro" \
              -e LUMIC_TEST_BINARY=/opt/lumic \
              -e LUMIC_TEST_DAEMON_BINARY=/opt/lumicd \
              "$image" sh -c '/test.sh && apt-get update && apt-get install -y git && /epic-d-test.sh && /epic-g-test.sh'
          done
      - name: Attest nightly binaries
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: 'lumic*-x86_64-unknown-linux-musl'
      - name: Publish rolling nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly lumic-x86_64-unknown-linux-musl lumic-x86_64-unknown-linux-musl.sha256 lumicd-x86_64-unknown-linux-musl lumicd-x86_64-unknown-linux-musl.sha256 \
            --prerelease \
            --title "Lumic Nightly $(date -u +%Y-%m-%d)" \
            --notes "Automated tested nightly build from main at $GITHUB_SHA."
