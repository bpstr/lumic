name: WordPress golden

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wordpress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - run: cargo build --locked -p lumic-cli --release
      - run: sudo apt-get update
      - name: Install, reconcile and safely remove WordPress
        run: sudo -E env LUMIC_TEST_BINARY="$PWD/target/release/lumic" "$PWD/tests/wordpress-golden.sh"
