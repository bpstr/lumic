[workspace]
members = [
  "crates/lumic-core",
  "crates/lumic-platform",
  "crates/lumic-cli",
  "crates/lumic-daemon",
  "crates/lumic-mcp",
  "crates/lumic-ui",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bpstr/lumic"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
ed25519-dalek = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
