schema_version = 1
definition_version = 1
id = "clickhouse"
name = "ClickHouse"
category = "database"
description = "Column-oriented analytics database"
driver = "clickhouse"
instance_policy = "singleton"

[capabilities]
configure = true
start = true
stop = true
restart = true
enable = true
disable = true
health = true
logs = true
upgrade = true
remove = true

[[configuration]]
key = "bind"
label = "Bind address"
type = "address"
default = "127.0.0.1"
apply = "restart"

[[configuration]]
key = "port"
label = "HTTP port"
type = "port"
default = 8123
apply = "restart"

[[outputs]]
key = "http"
type = "http_endpoint"
capability = "analytics.clickhouse"

[[platforms]]
distribution = "debian"
package = "clickhouse-server"
unit = "clickhouse-server.service"
data_path = "/var/lib/clickhouse"

[[platforms]]
distribution = "ubuntu"
package = "clickhouse-server"
unit = "clickhouse-server.service"
data_path = "/var/lib/clickhouse"
