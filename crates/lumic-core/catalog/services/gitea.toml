schema_version = 1
definition_version = 1
id = "gitea"
name = "Gitea"
category = "other"
description = "Self-hosted Git forge backed by Lumic's managed repository root"
driver = "gitea"
instance_policy = "singleton"

[capabilities]
configure = true
start = true
stop = true
restart = true
enable = true
disable = true
health = true
logs = true
upgrade = true
remove = true

[[configuration]]
key = "bind"
label = "Bind address"
type = "address"
default = "127.0.0.1"
apply = "restart"

[[configuration]]
key = "port"
label = "HTTP port"
type = "port"
default = 3000
apply = "restart"

[[outputs]]
key = "http"
type = "http_endpoint"
capability = "git_forge.http"

[[outputs]]
key = "repository_root"
type = "filesystem_path"
capability = "git_forge.shared_repository_root"

[[platforms]]
distribution = "debian"
package = "gitea"
unit = "gitea.service"
data_path = "/var/lib/gitea"

[[platforms]]
distribution = "ubuntu"
package = "gitea"
unit = "gitea.service"
data_path = "/var/lib/gitea"
