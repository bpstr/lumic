schema_version = 1
definition_version = 1
id = "grafana"
name = "Grafana"
category = "other"
description = "Metrics and log visualization service"
driver = "grafana"
instance_policy = "singleton"

[capabilities]
configure = true
start = true
stop = true
restart = true
enable = true
disable = true
health = true
logs = true
upgrade = true
remove = true

[[configuration]]
key = "bind"
label = "Bind address"
type = "address"
default = "127.0.0.1"
apply = "restart"

[[configuration]]
key = "port"
label = "HTTP port"
type = "port"
default = 3000
apply = "restart"

[[configuration]]
key = "admin_password"
label = "Initial admin password"
type = "secret"
required = true
sensitive = true
apply = "restart"

[[outputs]]
key = "http"
type = "http_endpoint"
capability = "visualization.grafana"

[[platforms]]
distribution = "debian"
package = "grafana"
unit = "grafana-server.service"
data_path = "/var/lib/grafana"

[[platforms]]
distribution = "ubuntu"
package = "grafana"
unit = "grafana-server.service"
data_path = "/var/lib/grafana"
