schema_version = 1
definition_version = 1
id = "loki"
name = "Loki"
category = "other"
description = "Centralized log aggregation service"
driver = "loki"
instance_policy = "singleton"

[capabilities]
configure = true
start = true
stop = true
restart = true
enable = true
disable = true
health = true
logs = true
upgrade = true
remove = true

[[configuration]]
key = "bind"
label = "Bind address"
type = "address"
default = "127.0.0.1"
apply = "restart"

[[configuration]]
key = "port"
label = "HTTP port"
type = "port"
default = 3100
apply = "restart"

[[configuration]]
key = "retention_period"
label = "Retention period"
type = "string"
default = "168h"
apply = "restart"

[[outputs]]
key = "http"
type = "http_endpoint"
capability = "logs.loki"

[[platforms]]
distribution = "debian"
package = "loki"
unit = "loki.service"
data_path = "/var/lib/loki"

[[platforms]]
distribution = "ubuntu"
package = "loki"
unit = "loki.service"
data_path = "/var/lib/loki"
