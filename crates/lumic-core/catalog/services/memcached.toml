schema_version = 1
definition_version = 1
id = "memcached"
name = "Memcached"
category = "cache"
description = "In-memory cache service"
driver = "memcached"
instance_policy = "singleton"

[capabilities]
configure = true
start = true
stop = true
restart = true
enable = true
disable = true
health = true
logs = true
upgrade = true
remove = true

[[configuration]]
key = "bind"
label = "Bind address"
type = "address"
default = "127.0.0.1"
apply = "restart"

[[configuration]]
key = "port"
label = "Port"
type = "port"
default = 11211
apply = "restart"

[[configuration]]
key = "memory_mb"
label = "Memory limit (MiB)"
type = "integer"
minimum = 16
maximum = 1048576
default = 64
apply = "restart"

[[outputs]]
key = "connection"
type = "tcp_endpoint"
capability = "cache.memcached"

[[platforms]]
distribution = "debian"
package = "memcached"
unit = "memcached.service"
data_path = "/var/lib/memcached"

[[platforms]]
distribution = "ubuntu"
package = "memcached"
unit = "memcached.service"
data_path = "/var/lib/memcached"
