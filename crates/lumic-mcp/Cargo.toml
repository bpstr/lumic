[package]
name = "lumic-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
lumic-core = { path = "../lumic-core" }
lumic-platform = { path = "../lumic-platform" }
rmcp = { version = "3.1.2", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
rmcp = { version = "3.1.2", features = ["client"] }
tower = { version = "0.5", features = ["util"] }
